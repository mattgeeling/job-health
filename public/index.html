<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Health</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Job Health</h1>
  <p class="topbar-sub">Open live jobs — margin &amp; hours tracker</p>
</header>

<main class="main">
  <div class="controls">
    <label for="handlerFilter">Handler</label>
    <select id="handlerFilter">
      <option value="">All handlers</option>
    </select>
    <button id="syncBtn" class="sync-btn" type="button">Sync now</button>
    <span class="sync-status" id="syncStatus"></span>
    <span class="last-synced" id="lastSynced"></span>
  </div>

  <div class="profit-panel" id="profitPanel"></div>

  <div class="summary" id="summary"></div>

  <table class="job-table" id="jobTable">
    <thead>
      <tr>
        <th></th>
        <th>Job</th>
        <th>Client</th>
        <th>Handler</th>
        <th>Due</th>
        <th>Quoted</th>
        <th>Net margin</th>
        <th>Net margin %</th>
        <th>Hours (act/est)</th>
        <th>Hours %</th>
      </tr>
    </thead>
    <tbody id="jobTableBody"></tbody>
  </table>
</main>

<script src="app.js"></script>
</body>
</html>
